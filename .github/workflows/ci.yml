name: CI

# Single MSYS2-on-Windows job for v1.0.0 (U-38). Linux build lands in
# v1.1.0 — this workflow can grow into a matrix when that arrives.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows-msys2:
    name: build + test (Windows / MSYS2)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # `make` is the msys2-native package (provides /usr/bin/make).
          # `mingw-w64-x86_64-make` would only provide `mingw32-make`,
          # which is not what the project's Makefile invokes.
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-raylib
            mingw-w64-x86_64-python

      - name: Print toolchain versions
        run: |
          gcc --version
          make --version | head -1
          python --version

      - name: Build CLI
        run: make cli

      - name: Build GUI
        run: make gui

      - name: Run full test suite
        run: make test

      - name: Show build artefacts
        run: ls -lh dcs_cli.exe dcs_gui.exe
